name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi
          # Check if any project code files changed. Agent skills are repository
          # automation assets and should not trigger the Java CI matrix.
          CODE_FILES=$(echo "$FILES" | grep -vE '(\.md$|\.txt$|^LICENSE$|^\.agents/skills/)' | grep -v '^$' || true)
          if [ -n "$CODE_FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Check Java formatting
        run: mvn spotless:check --batch-mode --no-transfer-progress

      - name: Build and test SafeRE, crosscheck, and exhaustive modules
        run: >
          mvn verify -pl safere,safere-crosscheck,safere-exhaustive -am
          -Pcrosscheck-public-api-tests
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

      - name: Run work-counter scaling tests
        run: >
          mvn clean test -pl safere
          -Pwork-counters
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

  fuzz-regression:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Build SafeRE for fuzz tests
        run: >
          mvn -pl safere -am install
          -DskipTests
          --batch-mode --no-transfer-progress

      - name: Run fuzz regression seeds
        run: >
          mvn -pl safere-fuzz test
          --batch-mode --no-transfer-progress

  benchmark-python-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test benchmark result processing
        run: python -m unittest safere-benchmarks/scripts/test_compare_benchmarks.py

  benchmark-smoke-test-java:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Smoke test Java benchmarks
        run: |
          ./run-java-benchmarks.sh \
            --smoke \
            '^org\.safere\.benchmark\.CrossEngineBenchmark\.run$' \
            -- \
            -p \
            'crossEngineTrial=RegexBenchmark.emailFind@safere-string,RegexBenchmark.emailFind@safere-utf8,RegexBenchmark.emailFind@jdk-string,RegexBenchmark.emailFind@re2j-string,RegexBenchmark.emailFind@re2-ffm-string-conversion'

      - name: Smoke test Java memory benchmarks (GC profiler)
        run: |
          ./run-java-memory-benchmarks.sh \
            --smoke \
            '^org\.safere\.benchmark\.CrossEngineBenchmark\.run$' \
            -- \
            -p \
            'crossEngineTrial=RegexBenchmark.emailFind@safere-string,RegexBenchmark.emailFind@safere-utf8,RegexBenchmark.emailFind@jdk-string,RegexBenchmark.emailFind@re2j-string,RegexBenchmark.emailFind@re2-ffm-string-conversion'

      - name: Smoke test Java memory benchmarks (pattern sizes)
        run: |
          java -Xms256m -Xmx256m \
            -Dsafere.benchmark.corpus="$PWD/safere-benchmarks/target/benchmark-corpus" \
            -cp safere-benchmarks/target/benchmarks.jar \
            org.safere.benchmark.MemoryBenchmark

  benchmark-smoke-test-cpp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Materialize shared benchmark inputs
        run: ./materialize-benchmark-inputs.sh

      - name: Compile native C++ regex benchmarks
        run: |
          mkdir -p safere-benchmarks/cpp/build
          cmake -S safere-benchmarks/cpp -B safere-benchmarks/cpp/build \
            -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build safere-benchmarks/cpp/build --parallel

      - name: Test C++ benchmark support code
        run: ctest --test-dir safere-benchmarks/cpp/build --output-on-failure

      - name: Smoke test C++ RE2 benchmarks
        run: |
          safere-benchmarks/cpp/build/re2_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json literalMatch

      - name: Smoke test C++ RE2 memory benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: |
          safere-benchmarks/cpp/build/re2_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json MemoryBenchmark

      - name: Smoke test PCRE2 JIT benchmarks
        run: |
          safere-benchmarks/cpp/build/pcre2_jit_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json literalMatch

      - name: Smoke test PCRE2 JIT memory benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: |
          safere-benchmarks/cpp/build/pcre2_jit_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json MemoryBenchmark

  benchmark-smoke-test-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false

      - name: Materialize shared benchmark inputs
        run: ./materialize-benchmark-inputs.sh

      - name: Compile Go benchmarks
        run: cd safere-benchmarks/go && go build -o regexp_benchmark .

      - name: Smoke test Go benchmarks
        run: |
          safere-benchmarks/go/regexp_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json literalMatch

      - name: Smoke test Go memory benchmarks
        run: |
          safere-benchmarks/go/regexp_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json MemoryBenchmark

  benchmark-smoke-test-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Rust
        # Pin the master ancestor behind the synthetic 1.85.0 ref. Synthetic commits may
        # eventually be garbage-collected because they are outside master history.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Test Rust benchmark support code
        run: |
          cargo fmt --check --manifest-path safere-benchmarks/rust/Cargo.toml
          cargo test --locked --all-features \
            --manifest-path safere-benchmarks/rust/Cargo.toml
          cargo clippy --locked --all-targets --all-features \
            --manifest-path safere-benchmarks/rust/Cargo.toml -- -D warnings

      - name: Smoke test Rust regex benchmarks
        run: ./run-rust-benchmarks.sh RegexBenchmark.literalMatch
