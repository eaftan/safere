name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi
          # Check if any project code files changed. Agent skills are repository
          # automation assets and should not trigger the Java CI matrix.
          CODE_FILES=$(echo "$FILES" | grep -vE '(\.md$|\.txt$|^LICENSE$|^\.agents/skills/)' | grep -v '^$' || true)
          if [ -n "$CODE_FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Check Java formatting
        run: mvn spotless:check --batch-mode --no-transfer-progress

      - name: Build and test SafeRE, crosscheck, and exhaustive modules
        run: >
          mvn verify -pl safere,safere-crosscheck,safere-exhaustive -am
          -Pcrosscheck-public-api-tests
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

      - name: Run work-counter scaling tests
        run: >
          mvn clean test -pl safere
          -Pwork-counters
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

  build-vector:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Install multi-release SafeRE JAR
        run: >
          mvn install -pl safere -am
          -DskipTests
          --batch-mode --no-transfer-progress

      - name: Run full SafeRE tests with Vector enabled
        run: >
          mvn clean test -pl safere
          -Pvector-tests
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

      - name: Run public API crosscheck with Vector enabled
        run: >
          mvn clean test
          -f safere-crosscheck/pom.xml
          -Pcrosscheck-public-api-tests
          -DargLine="--add-modules=jdk.incubator.vector
          -Dorg.safere.experimental.vectorScanProvider=vector"
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

      - name: Run exhaustive validation tests with Vector enabled
        run: >
          mvn clean test
          -f safere-exhaustive/pom.xml
          -DargLine="--add-modules=jdk.incubator.vector
          -Dorg.safere.experimental.vectorScanProvider=vector"
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

      - name: Run work-counter scaling tests with Vector enabled
        run: >
          mvn clean test -pl safere
          -Pwork-counters,vector-tests
          -Dtest.parallelism=4
          --batch-mode --no-transfer-progress

  fuzz-regression:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Build SafeRE for fuzz tests
        run: >
          mvn -pl safere -am install
          -DskipTests
          --batch-mode --no-transfer-progress

      - name: Run fuzz regression seeds
        run: >
          mvn -pl safere-fuzz test
          --batch-mode --no-transfer-progress

  benchmark-python-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test benchmark result processing
        run: python -m unittest safere-benchmarks/scripts/test_compare_benchmarks.py

  benchmark-smoke-test-java:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Smoke test Java benchmarks
        run: |
          ./run-java-benchmarks.sh \
            --smoke \
            '^org\.safere\.benchmark\.CrossEngineBenchmark\.run$' \
            -- \
            -p \
            'crossEngineTrial=RegexBenchmark.emailFind@safere-string,RegexBenchmark.emailFind@safere-utf8,RegexBenchmark.emailFind@jdk-string,RegexBenchmark.emailFind@re2j-string,RegexBenchmark.emailFind@re2-ffm-string-conversion'

      - name: Smoke test Java memory benchmarks (GC profiler)
        run: |
          ./run-java-memory-benchmarks.sh \
            --smoke \
            '^org\.safere\.benchmark\.CrossEngineBenchmark\.run$' \
            -- \
            -p \
            'crossEngineTrial=RegexBenchmark.emailFind@safere-string,RegexBenchmark.emailFind@safere-utf8,RegexBenchmark.emailFind@jdk-string,RegexBenchmark.emailFind@re2j-string,RegexBenchmark.emailFind@re2-ffm-string-conversion'

      - name: Smoke test Java memory benchmarks (pattern sizes)
        run: |
          java -Xms256m -Xmx256m \
            -Dsafere.benchmark.corpus="$PWD/safere-benchmarks/target/benchmark-corpus" \
            -cp safere-benchmarks/target/benchmarks.jar \
            org.safere.benchmark.MemoryBenchmark

  vector-multi-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Check Vector source formatting
        run: |
          mvn spotless:check \
            --batch-mode --no-transfer-progress \
            -f safere/pom.xml
          mvn spotless:check \
            --batch-mode --no-transfer-progress \
            -f safere-vector-benchmarks/pom.xml

      - name: Build and inspect multi-release SafeRE JAR
        run: |
          mvn package -pl safere -am -Prelease -DskipTests \
            --batch-mode --no-transfer-progress
          SAFERE_JAR="$(find safere/target -maxdepth 1 -name 'safere-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          jar --list --file "$SAFERE_JAR" \
            | grep 'META-INF/versions/26/org/safere/IncubatorVectorScanProvider.class'

      - name: Smoke test experimental Vector scanner
        run: |
          ./run-vector-benchmarks.sh \
            --fastbuild \
            --smoke \
            --end-to-end \
            --trials \
            'pair/first/absent/1024/0,range/first/absent/1024/0'

  benchmark-smoke-test-cpp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Materialize shared benchmark inputs
        run: ./materialize-benchmark-inputs.sh

      - name: Compile native C++ regex benchmarks
        run: |
          mkdir -p safere-benchmarks/cpp/build
          cmake -S safere-benchmarks/cpp -B safere-benchmarks/cpp/build \
            -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build safere-benchmarks/cpp/build --parallel

      - name: Test C++ benchmark support code
        run: ctest --test-dir safere-benchmarks/cpp/build --output-on-failure

      - name: Smoke test C++ RE2 benchmarks
        run: |
          safere-benchmarks/cpp/build/re2_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --smoke RegexBenchmark.literalMatch

      - name: Check C++ RE2 planned exclusions
        run: |
          safere-benchmarks/cpp/build/re2_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --list-exclusions MemoryBenchmark.compileSimple

      - name: Smoke test PCRE2 JIT benchmarks
        run: |
          safere-benchmarks/cpp/build/pcre2_jit_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --smoke RegexBenchmark.literalMatch

      - name: Check PCRE2 JIT planned exclusions
        run: |
          safere-benchmarks/cpp/build/pcre2_jit_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --list-exclusions ReplaceBenchmark

  benchmark-smoke-test-go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: false

      - name: Materialize shared benchmark inputs
        run: ./materialize-benchmark-inputs.sh

      - name: Compile Go benchmarks
        run: cd safere-benchmarks/go && go build -o regexp_benchmark .

      - name: Smoke test Go benchmarks
        run: |
          safere-benchmarks/go/regexp_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --smoke RegexBenchmark.literalMatch

      - name: Check Go planned exclusions
        run: |
          safere-benchmarks/go/regexp_benchmark \
            --manifest safere-benchmarks/target/benchmark-corpus/manifest.json \
            --list-exclusions UnicodeCompileBenchmark

  benchmark-smoke-test-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Rust
        # Pin the master ancestor behind the synthetic 1.85.0 ref. Synthetic commits may
        # eventually be garbage-collected because they are outside master history.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Test Rust benchmark support code
        run: |
          cargo fmt --check --manifest-path safere-benchmarks/rust/Cargo.toml
          cargo test --locked --all-features \
            --manifest-path safere-benchmarks/rust/Cargo.toml
          cargo clippy --locked --all-targets --all-features \
            --manifest-path safere-benchmarks/rust/Cargo.toml -- -D warnings

      - name: Smoke test Rust regex benchmarks
        run: ./run-rust-benchmarks.sh --smoke RegexBenchmark.literalMatch

  benchmark-smoke-test-dotnet:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Smoke test .NET non-backtracking benchmarks
        run: ./run-dotnet-benchmarks.sh --smoke RegexBenchmark.literalMatch

      - name: Check .NET planned exclusions
        run: ./run-dotnet-benchmarks.sh --list-exclusions UnicodeCompileBenchmark
