name: Publish snapshot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Keep metadata updates and the independent consumer check in one serialized job.
concurrency:
  group: central-snapshot-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run otherwise checks out the current default-branch head.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up production JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version-file: .sdkmanrc
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Require a snapshot version
        id: version
        run: |
          VERSION=$(mvn -pl safere help:evaluate -Dexpression=project.version \
            -q -DforceStdout --no-transfer-progress)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Expected a -SNAPSHOT version, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for a newer successful main CI run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: bash .github/scripts/check-snapshot-freshness.sh

      - name: Publish to Central Portal snapshots
        if: steps.freshness.outputs.current == 'true'
        run: mvn -pl safere deploy -Prelease -DskipTests --batch-mode --no-transfer-progress
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify public snapshot consumption
        if: steps.freshness.outputs.current == 'true'
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/verify-snapshot.sh "$SNAPSHOT_VERSION"
