name: Exploratory fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  broad:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          java-version-file: .sdkmanrc
          cache: maven
      - name: Broad differential discovery
        run: safere-fuzz/scripts/run-fuzz-test.sh --suite broad --max-duration 2m --keep-going 3
      - name: Preserve findings and run provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exploratory-fuzz-evidence
          path: safere-fuzz/target/fuzz-logs/
          retention-days: 30
