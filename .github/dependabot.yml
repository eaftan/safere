version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # ICU 79+ uses Unicode 18. Upgrade with the generated tables, grapheme
      # fixtures, and generator JDK; see safere-unicode/README.md.
      - dependency-name: "com.ibm.icu:icu4j"
        versions: ["[79.0,)"]
      # Surefire 3.6+ prevents Jazzer 0.30.0 from dynamically attaching its
      # instrumentation agent. Revisit when Jazzer supports this configuration.
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        versions: ["[3.6.0,)"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
