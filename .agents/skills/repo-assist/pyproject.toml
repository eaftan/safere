[project]
name = "repo-assist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
repo-assist = "repo_assist.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
